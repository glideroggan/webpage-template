<!DOCTYPE html>
<html lang="sv-SE">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ert företag - startsida</title>
  <link rel="icon" href="data:,">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg-app);
      color: var(--text-primary);
      line-height: var(--leading-body);
      -webkit-font-smoothing: antialiased;
    }

    /*
     * Design tokens. Components never hard-code a colour, size, border, font or shadow: they read
     * these custom properties, which cross shadow DOM boundaries. Re-theme by editing this block only.
     * The look is deliberately neutral (system fonts, grey surfaces, one plain blue accent), so a
     * style from styles/ can replace these values without fighting an existing brand.
     */
    :root {
      color-scheme: light dark;

      /* Typography: system fonts, so the page loads no web fonts until a style adds them. */
      --font-heading: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --weight-semibold: 600;
      --weight-bold: 700;
      --leading-tight: 1.1;
      --leading-snug: 1.2;
      --leading-body: 1.6;
      --tracking-wide: 0.08em;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.75rem;
      --text-3xl: 2.25rem;
      --text-hero: clamp(2rem, 6vw, 3.5rem);

      /* Spacing */
      --space-2xs: 0.25rem;
      --space-xs: 0.5rem;
      --space-sm: 0.75rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 3rem;
      --space-3xl: 5rem;
      --content-width: 72rem;
      --text-width: 40rem;
      --form-width: 44rem;
      --heading-width: 22ch;
      --badge-size: 2.25rem;
      --avatar-size: 4rem;
      --card-min: 16rem;
      --card-min-sm: 9rem;
      --header-offset: 5rem;
      --z-header: 10;

      /* Shape and motion */
      --border-width: 1px;
      --border-width-strong: 2px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 50%;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --transition-fast: 150ms ease;

      /* Surfaces (light) */
      --bg-app: #f6f7f9;
      --bg-surface: #ffffff;
      --bg-surface-alt: #eef0f3;
      --border-base: #d9dde3;
      --border-strong: #7b8594;

      /* Text (light). --text-muted is at least 4.5:1 on every light surface. */
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #4b5563;

      /*
       * Accent. --accent-primary is for borders, rings and large shapes; small text and button
       * fills use --accent-text / --accent-strong, which keep at least 4.5:1 against their background.
       */
      --accent-primary: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-strong-hover: #1e40af;
      --accent-text: #1d4ed8;
      --accent-on-strong: #ffffff;
      --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 45%, transparent);

      /* Built from the surface tokens, so it follows dark mode and any style that changes them. */
      --hero-gradient: linear-gradient(180deg, var(--bg-surface-alt) 0%, var(--bg-app) 100%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-app: #0f1115;
        --bg-surface: #1f232c;
        --bg-surface-alt: #161920;
        --border-base: #2a2f3a;
        --border-strong: #6b7383;

        --text-primary: #e5e7eb;
        --text-secondary: #c4c9d2;
        --text-muted: #9aa3b2;

        --accent-primary: #60a5fa;
        --accent-strong: #3b82f6;
        --accent-strong-hover: #60a5fa;
        --accent-text: #93c5fd;
        --accent-on-strong: #0b1220;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <script type="module" src="./main.js"></script>
</body>
</html>
