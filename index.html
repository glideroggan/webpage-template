<!DOCTYPE html>
<html lang="sv-SE">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ert företag - startsida</title>
  <link rel="icon" href="data:,">

  <!-- The default theme's font. Every other theme imports its own fonts from its file in src/themes/. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--bg-app);
      color: var(--text-primary);
      line-height: var(--leading-body);
      -webkit-font-smoothing: antialiased;
    }

    /*
     * Design tokens: the default theme (Timesheet). Components never hard-code a colour, size, border,
     * font or shadow: they read these custom properties, which cross shadow DOM boundaries.
     * A theme in src/themes/<name>.css overrides them under :root[data-theme="<name>"], which beats both
     * blocks below, so a theme looks the same whatever mode the system is in.
     * Where a Timesheet colour misses this starter's contrast rules (4.5:1 for text, 3:1 for input
     * borders), another Timesheet colour is used: --border-strong, --text-muted, --accent-strong and --header-bg.
     */
    :root {
      color-scheme: light dark;

      /* Typography */
      --font-heading: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* The brand in the header; a theme can give it its signature face (Vykort's hand, Pipeline's mono). */
      --font-brand: var(--font-heading);
      --weight-semibold: 600;
      --weight-bold: 700;
      --leading-tight: 1.1;
      --leading-snug: 1.2;
      --leading-body: 1.5;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 2.25rem;

      /* Spacing (8px grid) */
      --space-2xs: 0.25rem;
      --space-xs: 0.5rem;
      --space-sm: 0.75rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 3rem;
      --content-width: 72rem;
      --text-width: 40rem;
      --card-min: 16rem;
      --header-offset: 5rem;
      /* Minimum height of a tap target on a phone (the header link and select). */
      --touch-target: 2.5rem;
      --z-header: 10;

      /* Shape and motion */
      --border-width: 1px;
      --border-width-strong: 2px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --transition-fast: 150ms ease;

      /* Surfaces (light) */
      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-alt: #f8fafc;
      --border-base: #e2e8f0;
      /* Timesheet's #cbd5e1 is 1.5:1 on white; its muted text colour gives an input border 4.8:1. */
      --border-strong: #64748b;

      /* Text (light). Timesheet's muted #64748b is 4.3:1 on the page background, so muted uses its secondary. */
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #475569;

      /*
       * Accent. --accent-primary is for borders, rings and large shapes; small text and button
       * fills use --accent-text / --accent-strong, which keep at least 4.5:1 against their background.
       * White on Timesheet's #6366f1 is 4.47:1, so fills use its hover indigo #4f46e5 (6.3:1) and
       * hover one step darker, #4338ca (7.9:1).
       */
      --accent-primary: #6366f1;
      --accent-strong: #4f46e5;
      --accent-strong-hover: #4338ca;
      --accent-text: #4f46e5;
      --accent-on-strong: #ffffff;
      /*
       * Opaque, so the ring keeps at least 3:1 against the page in every theme: a 1px gap in the page
       * colour, then 3px of --accent-text. Built from tokens, so each theme gets its own ring.
       */
      --focus-ring: 0 0 0 1px var(--bg-app), 0 0 0 4px var(--accent-text);

      /* Header bar: every theme sets both. White on #4f46e5 is 6.3:1 (on #6366f1 it would be 4.47:1). */
      --header-bg: #4f46e5;
      --header-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-app: #0b0f19;
        --bg-surface: #1e293b;
        --bg-surface-alt: #334155;
        --border-base: #334155;
        /* Timesheet's #475569 is 1.9:1 on the dark surface; #64748b gives 3.1:1. */
        --border-strong: #64748b;

        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        /* Timesheet's #64748b is 3.1:1 on the dark surface. */
        --text-muted: #94a3b8;

        --accent-primary: #818cf8;
        --accent-strong: #818cf8;
        --accent-strong-hover: #a5b4fc;
        --accent-text: #a5b4fc;
        --accent-on-strong: #0f172a;

        /* The indigo bar stays in dark mode, a deep indigo that sets the bar apart from the page. */
        --header-bg: #312e81;
        --header-text: #ffffff;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <script type="module" src="./main.js"></script>
</body>
</html>
